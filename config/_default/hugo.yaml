title: Dawit Kiros Redie
baseURL: "https://dawitkiros.github.io/"
defaultContentLanguage: en
enableRobotsTXT: true
cleanDestinationDir: true
enableEmoji: true
summaryLength: 30
pagination:
  pagerSize: 20
disableAliases: true
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
permalinks:
  event: "/talk/:slug/"
  tags: "/tag/:slug/"
  categories: "/category/:slug/"
  publication_types: "/publication-type/:slug/"
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
imaging:
  jpeg:
    quality: 85
  webp:
    quality: 85
  resampleFilter: lanczos
markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    style: friendly
    noClasses: true
