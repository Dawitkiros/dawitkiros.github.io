# All layouts and assets are local. No theme imports.
imports: []
hugoVersion:
  min: '0.169.0'
mounts:
  - source: static
    target: static
    files:
      - '! tracker'
      - '! tracker/**'
      - '! .DS_Store'
      - '! **/.DS_Store'
  - source: content
    target: content
    files:
      - '! project/gym-tracker'
      - '! project/gym-tracker/**'
