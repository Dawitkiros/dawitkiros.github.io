<details class="experience-row"><summary><span class="experience-dates">{{ time.Format "Jan 2006" .date_start }} - {{ if .date_end }}{{ time.Format "Jan 2006" .date_end }}{{ else }}now{{ end }}</span><span class="experience-role"><strong>{{ .title }}</strong><span>{{ .company }}</span></span><span class="expand-icon" aria-hidden="true">+</span></summary><div class="experience-description"><p class="eyebrow">{{ .location }}</p>{{ .description | markdownify }}{{ with .company_url }}<a class="text-link" href="{{ . }}">Organization {{ partial "icon.html" "arrow-up-right" }}</a>{{ end }}</div></details>
